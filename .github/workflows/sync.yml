name: Tägliche Synchronisation – ASC Cranz Estebruegge

on:
  schedule:
    - cron: "0 3 * * *"   # täglich um 03:00 UTC (= 04:00 / 05:00 Uhr DE)
  workflow_dispatch:        # manuell auslösbar (zum Testen)

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Code auschecken ──────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Python einrichten ────────────────────────────────────────────
      - name: Python 3.12 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Abhängigkeiten installieren
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      # ── 3. SSH-Tunnel zur Datenbank ─────────────────────────────────────
      - name: SSH-Schlüssel einrichten
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: SSH-Tunnel starten (Port 3306 → Webserver localhost:3306)
        run: |
          ssh -f -N \
            -L 13306:127.0.0.1:3306 \
            -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            -o ServerAliveInterval=60 \
            -o ExitOnForwardFailure=yes
          echo "Tunnel gestartet"
          sleep 2

      # ── 4. Synchronisation ausführen ────────────────────────────────────
      - name: Scraper ausführen
        env:
          DB_HOST:     "127.0.0.1"
          DB_PORT:     "13306"           # lokaler Tunnel-Port
          DB_NAME:     ${{ secrets.DB_NAME }}
          DB_USER:     ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: python scraper.py
