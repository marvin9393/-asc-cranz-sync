name: Tägliche Synchronisation – ASC Cranz Estebruegge

on:
  schedule:
    - cron: "0 3 * * *"   # täglich um 03:00 UTC (= 04:00 / 05:00 Uhr DE)
  workflow_dispatch:        # manuell auslösbar (zum Testen)

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      # ── 1. Code auschecken ──────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Python einrichten ────────────────────────────────────────────
      - name: Python 3.12 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Abhängigkeiten installieren
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      # ── 3. SSH-Schlüssel einrichten ─────────────────────────────────────
      - name: SSH-Schlüssel einrichten
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/asc_actions
          chmod 600 ~/.ssh/asc_actions
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      # ── 4. Synchronisation ausführen ────────────────────────────────────
      - name: Scraper ausführen (generiert SQL- und JSON-Datei)
        run: python scraper.py

      # ── 5. SQL auf Server importieren ───────────────────────────────────
      - name: SQL-Datei auf Server kopieren
        run: |
          scp -i ~/.ssh/asc_actions \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            /tmp/asc_data.sql \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/asc_data.sql

      - name: SQL auf Server importieren
        run: |
          ssh -i ~/.ssh/asc_actions \
            -o IdentitiesOnly=yes \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "mysql -u ${{ secrets.DB_USER }} -p'${{ secrets.DB_PASSWORD }}' ${{ secrets.DB_NAME }} < /tmp/asc_data.sql && echo 'Import erfolgreich' && rm /tmp/asc_data.sql"

      # ── 6. matches.json ins Repository committen (öffentlich via GitHub) ─
      - name: matches.json ins Repo schreiben und committen
        run: |
          mkdir -p data
          cp /tmp/asc_data.json data/matches.json
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add data/matches.json
          git diff --cached --quiet || git commit -m "chore: matches.json aktualisiert [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push

      - name: Debug-HTML hochladen (bei Fehler)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: /tmp/fussball_debug.html
          if-no-files-found: ignore
