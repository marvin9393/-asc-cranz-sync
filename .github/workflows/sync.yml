name: Tägliche Synchronisation – ASC Cranz Estebruegge

on:
  schedule:
    - cron: "0 3 * * *"   # täglich um 03:00 UTC (= 04:00 / 05:00 Uhr DE)
  workflow_dispatch:        # manuell auslösbar (zum Testen)

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Code auschecken ──────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Python einrichten ────────────────────────────────────────────
      - name: Python 3.12 einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Abhängigkeiten installieren
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      # ── 3. SSH-Schlüssel einrichten ─────────────────────────────────────
      - name: SSH-Schlüssel einrichten
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/asc_actions
          chmod 600 ~/.ssh/asc_actions
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      # ── 4. Synchronisation ausführen ────────────────────────────────────
      - name: Scraper ausführen (generiert SQL- und JSON-Datei)
        run: python scraper.py

      # ── 5. SQL auf Server importieren ───────────────────────────────────
      - name: SQL-Datei auf Server kopieren
        run: |
          scp -i ~/.ssh/asc_actions \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            /tmp/asc_data.sql \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/asc_data.sql

      - name: SQL auf Server importieren
        run: |
          ssh -i ~/.ssh/asc_actions \
            -o IdentitiesOnly=yes \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "mysql -u ${{ secrets.DB_USER }} -p'${{ secrets.DB_PASSWORD }}' ${{ secrets.DB_NAME }} < /tmp/asc_data.sql && echo 'Import erfolgreich' && rm /tmp/asc_data.sql"

      # ── 6. JSON in öffentlichen Webspace-Ordner kopieren ────────────────
      - name: /data/-Ordner auf Server anlegen (falls nicht vorhanden)
        run: |
          ssh -i ~/.ssh/asc_actions \
            -o IdentitiesOnly=yes \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "mkdir -p ${{ secrets.WEB_ROOT }}/data"

      - name: JSON-Datei in Webspace kopieren
        run: |
          scp -i ~/.ssh/asc_actions \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            /tmp/asc_data.json \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.WEB_ROOT }}/data/matches.json

      - name: Debug-HTML hochladen (bei Fehler)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: /tmp/fussball_debug.html
          if-no-files-found: ignore
